env: 
  # Configure environment variables.
  # Grant access to secrets in Cloud Secret Manager.
  - variable: FIREBASE_PROJECT_ID
    secret: projects/elite-entries/secrets/FIREBASE_PROJECT_ID/versions/latest
    
  - variable: FIREBASE_CLIENT_EMAIL
    secret: projects/elite-entries/secrets/FIREBASE_CLIENT_EMAIL/versions/latest

  - variable: FIREBASE_PRIVATE_KEY
    secret: projects/elite-entries/secrets/FIREBASE_PRIVATE_KEY/versions/latest

  - variable: ENCRYPTION_KEY
    secret: projects/elite-entries/secrets/ENCRYPTION_KEY/versions/latest
